const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pass){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const e=document.getElementById('e');e.textContent='';
  try{
    const html=await open(document.getElementById('p').value);
    try{sessionStorage.setItem('ok','1')}catch(_){}
    document.open();document.write(html);document.close();
  }catch(err){e.textContent='Pass errada.'}
});
